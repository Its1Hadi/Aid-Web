<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Aid | Health Profile</title>

        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <!-- Website name & navigation -->
        <header>
            <div class="brand">
                <span class="Logo" aria-hidden="true"></span>
                <h1>Aid <span>- Instant Support</span></h1>
                <p lang="ar" dir="rtl">عون للمساعدة الفورية</p>
            </div>

            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="profile.html" aria-current="page">Health Profile</a>
                <a href="request.html">Request Help</a>
                <a href="Emergency Info.html">Emergency Info</a>
                <a href="recovery.html">Recovery</a>
            </nav>
        </header>

        <main>
            <h2>Health Profile · الملف الصحي</h2>
            <p>
                Enter your health information and medical history ·
                ادخل معلوماتك الصحية وتاريخك الطبي
            </p>

            <form id="Health-Profile-Form" novalidate>
                <h3>Personal &amp; Medical Information</h3>
                <div class="Grid">
                    <div class="Field">
                        <label for="Full-name">
                            Full Name
                            <span lang=ar>الاسم كامل</span>
                        </label>
                        <input type="text" id="Full-name" name="fullName" placeholder="Enter Full Name" required>
                    </div>

                    <div class="Field">
                        <label for="Contact-name">
                            Emergency Name
                            <span lang="ar">اسم جهة الاتصال للطوارئ</span>
                        </label>
                        <input type="text" id="Contact-name" name="contactName" placeholder="Enter Contact Name" required>
                    </div>
                </div>

                <div class="Grid">
                    <div class="Field">
                        <label for="Phone">
                            Phone Number
                            <span lang="ar">رقم الهاتف</span>
                        </label>
                        <input type="tel" id="Phone" name="phone" placeholder="05X XXX XXXX" required>
                    </div>

                    <div class="Field">
                        <label for="Contact-Phone">
                            Emergency Contact Phone
                            <span lang="ar">رقم هاتف جهة الاتصال</span>
                        </label>
                        <input type="tel" id="Contact-Phone" name="contactPhone" placeholder="05X XXX XXXX" required>
                    </div>
                </div>

                <div class="Grid">
                    <div class="Field">
                        <label for="Blood-Type">Blood Type <span lang="ar">فصيلة الدم</span></label>
                        <select id="Blood-Type" name="bloodType" required>
                            <option value="">Select if known</option>
                            <option value="a-positive">A+</option>
                            <option value="a-negative">A-</option>
                            <option value="b-positive">B+</option>
                            <option value="b-negative">B-</option>
                            <option value="ab-positive">AB+</option>
                            <option value="ab-negative">AB-</option>
                            <option value="o-positive">O+</option>
                            <option value="o-negative">O-</option>
                            <option value="unknown">Unknown</option>
                        </select>
                    </div>

                    <div class="Field">
                        <label for="Conditions">
                            Chronic Conditions 
                            <span lang="ar">الأمراض المزمنة</span>
                        </label>
                        <textarea id="Conditions" name="conditions" rows="4" placeholder="List relevant conditions, if any"></textarea>
                    </div>
                </div>

                <div class="Grid">
                    <div class="Field">
                        <label for="Allergies">
                            Known Allergies
                            <span lang="ar">الحساسية المعروفة</span>
                        </label>
                        <textarea id="Allergies" name="allergies" rows="4" placeholder="List allergies, or write “None known”"></textarea>
                    </div>

                    <div class="Field">
                        <label for="Medications">
                            Current Medications 
                            <span lang="ar"> الأدوية الحالية</span>
                        </label>
                        <textarea id="Medications" name="medications" rows="4" placeholder="List current medications"></textarea>
                    </div>
                </div>

                <p id="Profile-Message" aria-live="polite"></p>
                <button type="submit">Save Profile · حفظ الملف</button>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 Aid - Instant Support</p>
        </footer>

        <script src="profile.js"></script>
    </body>
</html>
